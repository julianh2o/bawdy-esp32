# lightd + web UI on a home/venue network. See docs/DEPLOYMENT.md.
#
#   cp .env.example .env
#   mkdir -p config && sudo chown -R 10001 config   # lightd (uid 10001) writes its config here
#   docker compose up -d            # pulls julianh2o/bawdy-lights-daemon + julianh2o/bawdy-lights-web
#   docker compose up -d --build    # or build locally from this checkout
#   # then adopt boards at http://<host>:8080/config
#
# Networking: both services use `network_mode: host`.
#  - lightd needs it for mDNS discovery of WLED boards (multicast doesn't cross Docker's bridge).
#  - Both the web UI (WEB_PORT) and the lightd REST API (DAEMON_PORT) are exposed on the host
#    by default. The API has no auth (TODO.md #7): set DAEMON_API_HOST=127.0.0.1 in .env to keep
#    it local; the web UI still reaches it through its /engine/* proxy.
#  - With host networking `ports:` mappings are ignored; change WEB_PORT in .env instead.
services:
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
      target: daemon
    image: ${REGISTRY_USER:-julianh2o}/bawdy-lights-daemon:${IMAGE_TAG:-latest}
    container_name: bawdy-lights-daemon
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 10s   # allow the blackout frame on SIGTERM
    environment:
      LIGHTD_FPS: ${LIGHTD_FPS:-30}
      LIGHTD_HOST: ${DAEMON_API_HOST:-0.0.0.0}
      LIGHTD_PORT: ${DAEMON_PORT:-8765}
      LIGHTD_DRY_RUN: ${LIGHTD_DRY_RUN:-false}
    volumes:
      # Read-write: lightd saves controllers.json, user patterns (patterns/) and the running
      # patterns (lightd-state.json) here. It runs as uid 10001 (see docs/DEPLOYMENT.md).
      - ./config:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:${DAEMON_PORT:-8765}/api/status', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${REGISTRY_USER:-julianh2o}/bawdy-lights-web:${IMAGE_TAG:-latest}
    container_name: bawdy-lights-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      daemon:
        condition: service_started
    environment:
      SEQUENCER_HOST: 0.0.0.0
      SEQUENCER_PORT: ${WEB_PORT:-8080}
      ENGINE_URL: http://127.0.0.1:${DAEMON_PORT:-8765}
      # Pattern assistant (optional, see docs/DEPLOYMENT.md)
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:${WEB_PORT:-8080}/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Parked: the old universe/patch simulator (http://<host>:8090). It pairs with the old engine
  # daemon (run.py daemon --simulator), not with lightd.
  sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: Dockerfile.daemon
      target: sim
    image: bawdy-lights-sim   # local build only, not published
    container_name: bawdy-lights-sim
    network_mode: host
    restart: unless-stopped
    command: ["python", "sim.py", "--universe", "/config/universe.json", "--patch", "/config/patch.json", "--web-host", "0.0.0.0", "--web-port", "${SIM_WEB_PORT:-8090}", "--no-browser"]
    volumes:
      - ./config:/config:ro

