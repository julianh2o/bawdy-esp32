<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lights</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="/css/config.css">
  <link rel="stylesheet" href="/css/patterns.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Patterns</h1>
      <span id="lightd-status" class="pill">lightd…</span>
    </div>
    <div class="topbar-actions">
      <label class="switch" title="Off: lightd sends nothing and the boards show their own WLED effects">
        <input type="checkbox" id="output-toggle" role="switch" checked> <span>Output</span>
      </label>
      <a href="/config" class="icon-link" title="Controller setup" aria-label="Controller setup"><svg viewBox="0 0 24 24" width="18" height="18"
        aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="pe-layout">
    <aside class="pe-library" aria-labelledby="library-heading">
      <div class="column-head">
        <h2 id="scenes-heading">Scenes</h2>
      </div>
      <div id="scene-list" class="pe-list" aria-labelledby="scenes-heading"></div>

      <div class="column-head pe-library-head">
        <h2 id="library-heading">Library</h2>
        <button id="new-btn" class="btn btn-small" title="Start a new pattern">+ New</button>
      </div>
      <div id="library-list" class="pe-list"></div>
    </aside>

    <section class="pe-editor" aria-labelledby="editor-heading">
      <div class="pe-editor-head">
        <h2 id="editor-heading" class="sr-only">Editor</h2>
        <input type="text" id="name-input" placeholder="pattern-name" aria-label="Pattern name" spellcheck="false">
        <span id="source-tag" class="tag"></span>
        <span class="spacer"></span>
        <span id="dirty-indicator" class="muted small"></span>
        <button id="delete-btn" class="btn btn-small btn-ghost btn-danger">Delete</button>
        <button id="save-btn" class="btn btn-small">Save</button>
      </div>
      <div id="editor" class="pe-code"></div>
      <div id="error-bar" class="pe-error" hidden></div>

      <div id="assistant" class="card pe-assistant" hidden>
        <div class="row">
          <strong>Assistant</strong>
          <span id="assistant-model" class="muted small"></span>
          <span class="spacer"></span>
          <button id="assistant-clear" class="btn btn-small btn-ghost" title="Start a new conversation">New chat</button>
        </div>
        <div id="assistant-log" class="pe-chat-log" aria-live="polite"></div>
        <form id="assistant-form" class="pe-chat-form">
          <textarea id="assistant-input" rows="2" placeholder="Describe a new pattern, or a change to the code above…"
            aria-label="Message the assistant"></textarea>
          <button id="assistant-send" type="submit" class="btn btn-primary">Send</button>
        </form>
        <div class="row small muted">
          <label class="check" title="Put the assistant's code in the editor as soon as it checks out (undo with Ctrl-Z)">
            <input type="checkbox" id="assistant-autoapply"> Apply working code automatically</label>
          <span class="spacer"></span>
          <span>Enter to send · Shift-Enter for a new line</span>
        </div>
      </div>

      <div class="card pe-preview">
        <div class="row">
          <strong>Preview</strong>
          <span class="muted small">rendered in the browser with the same Lua runtime</span>
          <span class="spacer"></span>
          <label class="small muted">Pixels <input type="number" id="preview-count" min="1" max="2000" value="150"></label>
          <label class="small muted check"><input type="checkbox" id="preview-reversed"> Reversed</label>
          <button id="preview-play" class="btn btn-small">Pause</button>
        </div>
        <canvas id="preview-canvas" height="44"></canvas>
        <div class="row small muted"><span id="preview-time">t = 0.0 s</span><span class="spacer"></span><span id="preview-perf"></span></div>
      </div>
    </section>

    <aside class="pe-side" aria-labelledby="targets-heading">
      <div class="column-head">
        <h2 id="targets-heading">Run on</h2>
        <button id="refresh-btn" class="btn btn-small btn-ghost" title="Reload controllers">↻</button>
      </div>
      <div id="targets-list" class="stack"></div>

      <div class="column-head pe-params-head">
        <h2 id="params-heading">Params</h2>
        <button id="params-reset" class="btn btn-small btn-ghost" title="Every param back to its default">Reset</button>
      </div>
      <div id="params-form" class="pe-params" aria-labelledby="params-heading"></div>

      <div class="row pe-run-row">
        <button id="run-btn" class="btn btn-primary" disabled>Run on selected</button>
      </div>
      <p id="run-hint" class="muted small"></p>

      <div class="column-head pe-runs-head">
        <h2>Running</h2>
        <span class="row">
          <button id="stop-all-btn" class="btn btn-small btn-ghost btn-danger" title="Stop everything; all channels go black" aria-label="Stop all runs"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor"
            stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg></button>
          <button id="save-scene-btn" class="btn btn-small" title="Save everything playing now (patterns, params, brightness) as a scene">Save as scene…</button>
        </span>
      </div>
      <div id="runs-list" class="stack"></div>
    </aside>
  </main>

  <script type="module" src="/js/patterns.js"></script>
</body>
</html>
