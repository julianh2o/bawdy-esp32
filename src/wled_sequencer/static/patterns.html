<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lights</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="/css/config.css">
  <link rel="stylesheet" href="/css/patterns.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Interface</h1>
    </div>
    <div class="topbar-actions">
      <label class="switch" title="Output. Off: lightd sends nothing and the boards show their own WLED effects">
        <input type="checkbox" id="output-toggle" role="switch" aria-label="Output" checked>
      </label>
      <span id="lightd-status" class="pill">lightd…</span>
      <a href="/" class="icon-link" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24" width="18" height="18"
        aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></a>
      <a href="/config" class="icon-link" title="Controller setup" aria-label="Controller setup"><svg viewBox="0 0 24 24" width="18" height="18"
        aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="pe-layout">
    <aside class="pe-library" aria-labelledby="library-heading">
      <div class="column-head">
        <h2 id="scenes-heading">Scenes</h2>
      </div>
      <div id="scene-list" class="pe-list" aria-labelledby="scenes-heading"></div>

      <div class="column-head pe-library-head">
        <h2 id="library-heading">Library</h2>
      </div>
      <div id="library-list" class="pe-list"></div>

      <!-- Narrow screens: the lists collapse into dropdowns. -->
      <div class="pe-pick">
        <select id="scene-select" aria-label="Stage a scene on deck"></select>
        <button id="scene-play" class="btn btn-small" type="button" title="Play the picked scene now" aria-label="Play the picked scene now" hidden>▶</button>
        <select id="library-select" aria-label="Select a library pattern"></select>
      </div>
    </aside>

    <section class="pe-main" aria-label="Selected pattern, on deck and lights">
      <!-- Selected: the working copy -->
      <div id="selp" class="card selp" aria-labelledby="selected-heading">
        <div class="selp-main">
          <div class="selp-head">
            <h2 id="selected-heading" class="selp-h">Selected</h2>
            <span id="sel-name" class="selp-name"></span>
            <span id="sel-tag" class="tag"></span>
            <span id="sel-dirty" class="muted small"></span>
          </div>
          <canvas id="sel-canvas" class="selp-canvas" height="30"></canvas>
          <div id="sel-sub" class="selp-sub"></div>
          <div id="sel-error" class="pe-error" hidden></div>
          <form id="wiz" class="wiz" hidden>
            <textarea id="wiz-input" rows="2" aria-label="Ask the assistant to change the selected pattern"></textarea>
            <button id="wiz-send" type="submit" class="btn btn-primary btn-small">✨ Apply</button>
            <button id="wiz-close" type="button" class="btn btn-small btn-ghost" aria-label="Close">✕</button>
          </form>
          <div id="wiz-status" class="muted small" hidden></div>
          <div class="selp-actions">
            <button id="open-editor-btn" class="btn btn-small" type="button">✎ Open editor</button>
            <button id="ask-ai-btn" class="btn btn-small" type="button" hidden>✨ Ask AI</button>
            <button id="new-btn" class="btn btn-small" type="button" title="A new pattern, starting from the solid example">+ New</button>
            <button id="save-lib-btn" class="btn btn-small" type="button">Save to library</button>
            <button id="load-btn" class="btn btn-primary btn-small selp-load" type="button">Load to deck ↓</button>
          </div>
        </div>
        <div class="selp-side">
          <div class="column-head selp-params-head">
            <h2 id="params-heading">Params</h2>
            <button id="params-reset" class="btn btn-small btn-ghost" type="button" title="Params and brightness back to where this selection came from">Reset</button>
          </div>
          <div id="params-form" class="pe-params" aria-labelledby="params-heading"></div>
        </div>
      </div>

      <!-- On deck | Send | Lights, one row per strip -->
      <div id="board" class="card board">
        <div class="board-head bh-deck">
          <h2 id="deck-heading">On deck</h2>
          <span id="deck-scene" class="deck-scene muted small"></span>
          <span class="spacer"></span>
          <span class="row deck-actions">
            <button id="scene-save-btn" class="btn btn-small" type="button">Save</button>
            <button id="scene-saveas-btn" class="btn btn-small" type="button" title="Save the deck as a new scene">Save as…</button>
            <button id="scene-delete-btn" class="btn btn-small btn-ghost btn-danger" type="button">Delete</button>
            <button id="deck-clear-btn" class="btn btn-small btn-ghost" type="button" title="Empty every deck line">Clear</button>
          </span>
        </div>
        <div class="board-head bh-lights">
          <h2 id="targets-heading">Lights</h2>
          <span class="spacer"></span>
          <button id="stop-all-btn" class="btn btn-small btn-ghost btn-danger" type="button" title="Stop everything; every channel goes black">Stop all</button>
        </div>
        <div id="send-rail" class="send-rail">
          <button id="send-btn" class="btn btn-primary send-btn" type="button">Send ▶</button>
        </div>
        <div id="board-rows" class="board-rows"></div>
      </div>
    </section>
  </main>

  <!-- The editor, as a modal: name bar, preview on top, then code | assistant -->
  <div id="ed-scrim" class="ed-scrim" hidden>
    <div class="ed-modal" role="dialog" aria-modal="true" aria-labelledby="editor-heading">
      <div class="pe-editor-head">
        <h2 id="editor-heading" class="sr-only">Pattern editor</h2>
        <input type="text" id="name-input" placeholder="untitled" aria-label="Pattern name" spellcheck="false">
        <span id="source-tag" class="tag"></span>
        <select id="example-select" class="pe-examples" aria-label="Start from an example pattern" hidden></select>
        <span class="spacer"></span>
        <span id="dirty-indicator" class="muted small"></span>
        <button id="delete-btn" class="btn btn-small btn-ghost btn-danger" type="button" hidden>Delete</button>
        <button id="ed-reset-btn" class="btn btn-small btn-ghost" type="button" title="Code back to where this selection came from">Reset</button>
        <button id="save-btn" class="btn btn-small" type="button">Save to library</button>
        <button id="ed-done" class="btn btn-small btn-primary" type="button">Done</button>
        <button id="ed-close" class="btn btn-small btn-ghost" type="button" aria-label="Close" title="Close (Esc). Your edits stay in the selected pattern">✕</button>
      </div>

      <div class="card pe-preview">
        <div class="row">
          <strong>Preview</strong>
          <span class="muted small">rendered in the browser with the same Lua runtime</span>
          <span class="spacer"></span>
          <label class="small muted">Pixels <input type="number" id="preview-count" min="1" max="2000" value="150"></label>
          <label class="small muted check"><input type="checkbox" id="preview-reversed"> Reversed</label>
          <button id="preview-play" class="btn btn-small" type="button">Pause</button>
        </div>
        <canvas id="preview-canvas" height="44"></canvas>
        <div class="row small muted"><span id="preview-time">t = 0.0 s</span><span class="spacer"></span><span id="preview-perf"></span></div>
      </div>

      <div class="ed-body">
        <div class="ed-code">
          <div id="editor" class="pe-code"></div>
          <div id="error-bar" class="pe-error" hidden></div>
        </div>

        <div id="assistant" class="card pe-assistant" hidden>
          <div class="row">
            <strong>Assistant</strong>
            <span id="assistant-model" class="muted small"></span>
            <span class="spacer"></span>
            <button id="assistant-clear" class="btn btn-small btn-ghost" type="button" title="Start a new conversation">New chat</button>
          </div>
          <div id="assistant-log" class="pe-chat-log" aria-live="polite"></div>
          <form id="assistant-form" class="pe-chat-form">
            <textarea id="assistant-input" rows="2" placeholder="Describe a new pattern, or a change to the code…"
              aria-label="Message the assistant"></textarea>
            <button id="assistant-send" type="submit" class="btn btn-primary">Send</button>
          </form>
          <div class="row small muted">
            <label class="check" title="Put the assistant's code in the editor as soon as it checks out (undo with Ctrl-Z)">
              <input type="checkbox" id="assistant-autoapply" checked> Apply working code automatically</label>
            <span class="spacer"></span>
            <span>Enter to send · Shift-Enter for a new line</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/patterns.js"></script>
</body>
</html>
