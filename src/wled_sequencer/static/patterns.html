<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="/css/config.css">
  <link rel="stylesheet" href="/css/patterns.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <a href="/config" class="back-link" title="Controller setup">← Setup</a>
      <h1>Patterns</h1>
      <span id="lightd-status" class="pill">lightd…</span>
    </div>
    <div class="topbar-actions">
      <button id="blackout-btn" class="btn btn-danger" title="Stop every run; all channels go black">Blackout</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="pe-layout">
    <aside class="pe-library" aria-labelledby="library-heading">
      <div class="column-head">
        <h2 id="library-heading">Library</h2>
        <button id="new-btn" class="btn btn-small" title="Start a new pattern">+ New</button>
      </div>
      <div id="library-list" class="pe-list"></div>
    </aside>

    <section class="pe-editor" aria-labelledby="editor-heading">
      <div class="pe-editor-head">
        <h2 id="editor-heading" class="sr-only">Editor</h2>
        <input type="text" id="name-input" placeholder="pattern-name" aria-label="Pattern name" spellcheck="false">
        <span id="source-tag" class="tag"></span>
        <span class="spacer"></span>
        <span id="dirty-indicator" class="muted small"></span>
        <button id="delete-btn" class="btn btn-small btn-ghost btn-danger">Delete</button>
        <button id="save-btn" class="btn btn-small">Save</button>
      </div>
      <div id="editor" class="pe-code"></div>
      <div id="error-bar" class="pe-error" hidden></div>

      <div class="card pe-preview">
        <div class="row">
          <strong>Preview</strong>
          <span class="muted small">rendered in the browser with the same Lua runtime</span>
          <span class="spacer"></span>
          <label class="small muted">Pixels <input type="number" id="preview-count" min="1" max="2000" value="150"></label>
          <label class="small muted check"><input type="checkbox" id="preview-reversed"> Reversed</label>
          <button id="preview-play" class="btn btn-small">Pause</button>
          <button id="preview-restart" class="btn btn-small btn-ghost" title="Restart at t = 0">↺</button>
        </div>
        <canvas id="preview-canvas" height="44"></canvas>
        <div class="row small muted"><span id="preview-time">t = 0.0 s</span><span class="spacer"></span><span id="preview-perf"></span></div>
      </div>
    </section>

    <aside class="pe-side" aria-labelledby="targets-heading">
      <div class="column-head">
        <h2 id="targets-heading">Run on</h2>
        <button id="refresh-btn" class="btn btn-small btn-ghost" title="Reload controllers">↻</button>
      </div>
      <div id="targets-list" class="stack"></div>
      <div class="row pe-run-row">
        <button id="run-btn" class="btn btn-primary" disabled>Run on selected</button>
      </div>
      <p id="run-hint" class="muted small"></p>

      <div class="column-head pe-runs-head"><h2>Running</h2></div>
      <div id="runs-list" class="stack"></div>
    </aside>
  </main>

  <script type="module" src="/js/patterns.js"></script>
</body>
</html>
