[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bawdy-wled"
version = "0.1.0"
description = "WLED ESP32 lighting controller: UDP engine, hardware simulator, and sequencer"
authors = [{ name = "Julian Hartline" }, { name = "Georgia von Minden" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
wled-app = "wled_app.ui.cli:main"
ascii-wled = "wled_app.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
